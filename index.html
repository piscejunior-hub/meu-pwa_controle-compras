<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras Inteligente</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
      background: #f3f4f6;
    }

    h2 {
      margin-top: 30px;
    }

    input, button {
      padding: 8px;
      margin: 5px 0;
    }

    .produto {
      background: white;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .carrinho {
      background: #e5e7eb;
      padding: 10px;
      border-radius: 8px;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 5px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>

<h1>🛒 Lista de Compras Inteligente</h1>

<h2>📦 Cadastrar Produto</h2>
<input type="text" id="nomeProduto" placeholder="Nome do produto">
<input type="number" id="precoProduto" placeholder="Preço" step="0.01">
<button onclick="cadastrarProduto()">Cadastrar</button>

<h2>🛍 Produtos Disponíveis</h2>
<div id="listaProdutos"></div>

<h2>🧾 Carrinho</h2>
<div class="carrinho" id="carrinho"></div>
<div class="total" id="total"></div>

<h2>💰 Orçamento</h2>
<input type="number" id="orcamento" placeholder="Valor do orçamento">

<h2>🚗 Deslocamento</h2>
<input type="number" id="deslocamento" placeholder="Valor deslocamento">

<br><br>
<button class="btn-danger" onclick="novaCompra()">🆕 Nova Compra</button>

<script>
let produtos = JSON.parse(localStorage.getItem("produtos")) || [];
let carrinho = [];

function salvar() {
  localStorage.setItem("produtos", JSON.stringify(produtos));
}

function cadastrarProduto() {
  const nome = document.getElementById("nomeProduto").value;
  const preco = parseFloat(document.getElementById("precoProduto").value);

  if (!nome || isNaN(preco)) {
    alert("Preencha corretamente!");
    return;
  }

  produtos.push({ nome, preco });
  salvar();
  renderProdutos();

  document.getElementById("nomeProduto").value = "";
  document.getElementById("precoProduto").value = "";
}

function renderProdutos() {
  const lista = document.getElementById("listaProdutos");
  lista.innerHTML = "";

  produtos.forEach((produto, index) => {
    lista.innerHTML += `
      <div class="produto">
        <span>${produto.nome} - R$ ${produto.preco.toFixed(2)}</span>
        <button onclick="adicionarCarrinho(${index})">Comprar</button>
      </div>
    `;
  });
}

function adicionarCarrinho(index) {
  carrinho.push(produtos[index]);
  renderCarrinho();
}

function renderCarrinho() {
  const div = document.getElementById("carrinho");
  div.innerHTML = "";

  let total = 0;

  carrinho.forEach((item, index) => {
    total += item.preco;

    div.innerHTML += `
      <div class="produto">
        <span>${item.nome} - R$ ${item.preco.toFixed(2)}</span>
        <button class="btn-danger" onclick="removerCarrinho(${index})">X</button>
      </div>
    `;
  });

  document.getElementById("total").innerText = "Total: R$ " + total.toFixed(2);
}

function removerCarrinho(index) {
  carrinho.splice(index, 1);
  renderCarrinho();
}

function novaCompra() {
  carrinho = [];
  document.getElementById("orcamento").value = "";
  document.getElementById("deslocamento").value = "";
  renderCarrinho();
}

renderProdutos();
</script>

</body>
</html>
