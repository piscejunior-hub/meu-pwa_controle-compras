<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras por Voz</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1f1b2e;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .voice-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: #ccc;
    }

    .card {
      background: #2a243f;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 8px;
      border-bottom: 1px solid #444;
    }
  </style>
</head>
<body>

<h1>🛒 Lista de Compras Inteligente</h1>

<button class="voice-btn" onclick="startVoice()">🎤 Falar Comando</button>
<div id="status" class="status">Pronto para ouvir...</div>

<div class="card">
  <h3>💰 Orçamento:</h3>
  <p id="orcamento">R$ 0,00</p>
</div>

<div class="card">
  <h3>🚕 Deslocamento:</h3>
  <p id="deslocamento">R$ 0,00</p>
</div>

<div class="card">
  <h3>🧾 Carrinho:</h3>
  <ul id="lista"></ul>
</div>

<div class="card">
  <h3>📊 Total:</h3>
  <p id="total">R$ 0,00</p>
</div>

<script src="script.js"></script>
</body>
</html>
