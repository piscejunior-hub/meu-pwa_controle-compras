<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras por Voz</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a0dad">

<style>
body {
  font-family: Arial, sans-serif;
  background: #1b1026;
  color: #fff;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.section {
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

.roxo { background: linear-gradient(135deg,#7b2ff7,#4a00e0); }
.azul { background: #1e3a8a; }
.verde { background: #065f46; }
.laranja { background: #9a3412; }

button {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#voiceStatus {
  margin-top: 8px;
  font-size: 14px;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,.2);
}
</style>
</head>

<body>

<h1>🛒 Compras por Voz</h1>

<div class="section roxo">
  <button onclick="startVoice()">🎤 Falar</button>
  <div id="voiceStatus">Pronto para ouvir</div>
</div>

<div class="section azul">
  <strong>Produto em edição:</strong>
  <div id="currentProduct">Nenhum</div>
</div>

<div class="section verde">
  <strong>Carrinho:</strong>
  <ul id="cart"></ul>
  <div id="total"></div>
</div>

<div class="section laranja">
  <button onclick="finalizar()">✅ Finalizar compra</button>
  <button onclick="nova()">🆕 Nova compra</button>
</div>

<script src="script.js"></script>
</body>
</html>
