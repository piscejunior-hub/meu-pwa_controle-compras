<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Inteligente</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1, h2, h3 {
      margin-top: 20px;
    }

    .card {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .item-card {
      background: #374151;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>🛒 Lista Inteligente</h1>

  <div class="card">
    <h2>Configurações</h2>

    <label>Orçamento</label>
    <input type="number" id="budget" placeholder="Ex: 800">

    <div id="budgetInfo"></div>

    <label>Número de pessoas</label>
    <input type="number" id="familySize" placeholder="Ex: 3">

    <label>Custo com deslocamento</label>
    <input type="number" id="transportCost" placeholder="Ex: 40">
  </div>

  <div class="card">
    <h2>Adicionar Produto</h2>

    <input type="text" id="productName" placeholder="Nome do produto">

    <input type="number" id="price" placeholder="Preço">

    <select id="priceType">
      <option value="unit">Preço por unidade</option>
      <option value="total">Preço total da compra</option>
    </select>

    <input type="number" id="quantity" placeholder="Quantidade de pacotes">

    <input type="number" id="weightPerUnit" placeholder="Peso por pacote (kg)">

    <button onclick="addItem()">Adicionar</button>
    <button onclick="startVoice()">🎤 Adicionar por voz</button>
  </div>

  <div class="card">
    <h2>Compra Atual</h2>
    <ul id="shoppingList"></ul>
  </div>

  <div id="duracaoEstoque" class="card"></div>

  <script src="script.js"></script>
</body>
</html>
