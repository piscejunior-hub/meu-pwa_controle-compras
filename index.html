<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras por Voz</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0b1e;
  color: #fff;
}

h1 {
  text-align: center;
  margin: 15px 0;
}

.voice-main {
  background: linear-gradient(135deg,#7b2ff7,#4a00e0);
  border: none;
  width: 90%;
  margin: 10px auto;
  padding: 20px;
  border-radius: 18px;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  display: block;
  cursor: pointer;
}

.status {
  text-align: center;
  font-size: 14px;
  color: #dcd6ff;
  margin-bottom: 10px;
}

.line {
  width: 90%;
  margin: 10px auto;
  padding: 14px;
  border-radius: 14px;
}

.l1 { background:#3a136a; }
.l2 { background:#4a1b88; }
.l3 { background:#5a25a5; }
.l4 { background:#6b30c2; }

.line strong {
  display:block;
  margin-bottom:6px;
}

#shoppingList li {
  background:#2a1b44;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  list-style:none;
}

.total {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin: 15px;
}
</style>
</head>

<body>

<h1>🛒 Compras por Voz</h1>

<button class="voice-main" onclick="startVoice()">🎤 FALAR</button>
<div id="voiceStatus" class="status">Diga: "Adicionar arroz cinco quilos por trinta reais"</div>

<div class="line l1">
  <strong>📦 Último produto reconhecido</strong>
  <div id="lastProduct">Nenhum</div>
</div>

<div class="line l2">
  <strong>🧮 Quantidade / Peso</strong>
  <div id="lastQty">—</div>
</div>

<div class="line l3">
  <strong>💰 Preço</strong>
  <div id="lastPrice">—</div>
</div>

<div class="line l4">
  <strong>🧾 Carrinho</strong>
  <ul id="shoppingList"></ul>
</div>

<div class="total" id="totalGeral">Total: R$ 0,00</div>

<script src="script.js"></script>
</body>
</html>
