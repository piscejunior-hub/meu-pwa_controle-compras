<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4a00e0">
  <title>Lista de Compras Inteligente</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛒 Lista de Compras Inteligente</h1>

<button id="voiceBtn" class="voice-btn">🎤 Iniciar</button>
<div id="status" class="status">Pronto para ouvir...</div>

<div class="layout">

  <!-- 🔵 COLUNA ESQUERDA -->
  <div class="coluna-esquerda">

    <div class="card">
      <h3>💰 Orçamento</h3>
      <p id="orcamento">R$ 0,00</p>
    </div>

    <div class="card">
      <h3>🚕 Deslocamento</h3>
      <p id="deslocamento">R$ 0,00</p>
    </div>

    <div class="card">
      <h3>🧾 Carrinho</h3>
      <ul id="lista"></ul>
    </div>

    <div class="card">
      <h3>📊 Total</h3>
      <p id="total">R$ 0,00</p>
    </div>

  </div>

  <!-- 🟣 COLUNA DIREITA -->
  <div class="coluna-direita">

    <div class="card">
      <h3>📊 Consumo Calculado</h3>
      <div id="listaConsumo">
        <p style="color:#aaa;">Nenhum cálculo ainda...</p>
      </div>
    </div>

    <div class="card">
      <h3>🛒 Registrar Compra</h3>
      <div id="formCompra">
        <p style="color:#aaa;">Selecione um item do consumo</p>
      </div>
    </div>

  </div>

</div>

<script src="script.js"></script>

<script>
  const voiceBtn = document.getElementById("voiceBtn");

  voiceBtn.addEventListener("click", () => {
    startVoice();

    if (!voiceBtn.classList.contains("stop")) {
      voiceBtn.classList.add("stop");
      voiceBtn.textContent = "🛑 Parar";
    } else {
      voiceBtn.classList.remove("stop");
      voiceBtn.textContent = "🎤 Iniciar";
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("Service Worker registrado"))
      .catch(err => console.error("Erro SW:", err));
  }
</script>

</body>
</html>
